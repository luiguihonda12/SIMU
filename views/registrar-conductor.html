<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMU - Registrar Conductor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-simu shadow-sm">
        <nav class="navbar navbar-expand-lg container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="logo-simu.png" alt="Logo SIMU" class="me-2" style="height: 40px;">
                <span class="fw-bold text-dark">SIMU</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link text-dark" href="index.html">Inicio</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-dark" href="#" role="button" data-bs-toggle="dropdown">Gestión</a>
                        <ul class="dropdown-menu border-0 shadow">
                            <li><a class="dropdown-item" href="#">Lista de Conductores</a></li>
                            <li><a class="dropdown-item" href="#">Asignar Buses</a></li>
                        </ul>
                    </li>
                </ul>
                <button class="btn btn-outline-dark rounded-pill px-4">
                    <i class="bi bi-person-circle me-2"></i>Admin
                </button>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card border-0 shadow-lg p-4" style="border-radius: 20px;">
                    <div class="card-body">
                        <h2 class="fw-bold mb-4 text-center">Registrar Nuevo Conductor</h2>
                        
                        <form id="formRegistroConductor" class="needs-validation" novalidate>
                            
                            <h5 class="text-primary mb-3"><i class="bi bi-person-vcard me-2"></i>Información Personal</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Nombres Completos</label>
                                    <input type="text" class="form-control rounded-pill" placeholder="Ej: Juan Pérez" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Número de Cédula</label>
                                    <input type="number" class="form-control rounded-pill" placeholder="123456..." required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Teléfono de Contacto</label>
                                    <input type="tel" class="form-control rounded-pill" placeholder="300..." required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Número de Licencia</label>
                                    <input type="text" class="form-control rounded-pill" placeholder="Categoría C2/C3" required>
                                </div>
                            </div>

                            <h5 class="text-primary mb-3"><i class="bi bi-bus-front me-2"></i>Asignación de Servicio</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Asignar Bus (Placa/Interno)</label>
                                    <select class="form-select rounded-pill" required>
                                        <option value="" selected disabled>Seleccione un vehículo</option>
                                        <option value="1">Bus 01 - ABC-123</option>
                                        <option value="2">Bus 05 - XYZ-789</option>
                                        <option value="3">Bus 12 - MNO-456</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Ruta Asignada (Opcional)</label>
                                    <select class="form-select rounded-pill">
                                        <option value="" selected>Sin ruta definida</option>
                                        <option value="R1">Ruta 1: Chía - Centro</option>
                                        <option value="R2">Ruta 2: Vereda Bojacá</option>
                                        <option value="R3">Ruta 3: Portal Norte</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <button type="reset" class="btn btn-light rounded-pill px-4">Limpiar</button>
                                <button type="submit" class="btn btn-primary rounded-pill px-5 shadow">Guardar Conductor</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer-simu text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">2026 - Movilidad de Chía - SENA CDA</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
